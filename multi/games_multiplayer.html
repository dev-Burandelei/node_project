<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Pong Multiplayer</title>

<style>
body {
    margin: 0;
    overflow: hidden;
    background: black;
}

canvas {
    display: block;
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<!-- Socket.IO (cliente) -->
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

<script>
console.log("game.js carregado");

// ===== MAIN =====
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let w = window.innerWidth;
let h = window.innerHeight;

canvas.width = w;
canvas.height = h;

let timeScale = 1;

// ===== VARIÁVEIS =====
let p1_y, p2_y, p1_points, p2_points;
let ball_x, ball_y;
let ball_x_orientation, ball_y_orientation;
let ballSpeed = 400;

const p_w = 20;
const p_h = 200;
const p1_x = 10;
let p2_x;

let keys = {};
let lastTime = 0;
let deltaTime = 0;

let currentState = null;

// ===== SOCKET =====
const socket = io("http://localhost:3000"); // <- se local

const urlParams = new URLSearchParams(window.location.search);
const roomCode = urlParams.get("room");

let playerIndex = null;

// ===== GAME STATE =====
const gameState = {
    onEnter() {
        setup();
    },
    update(dt) {
        updateInput();
    },
    draw() {
        drawGame();
    }
};

// ===== LOOP =====
function loop(time) {
    if (!lastTime) lastTime = time;

    deltaTime = (time - lastTime) / 1000;
    lastTime = time;

    if (currentState?.update) currentState.update(deltaTime);
    if (currentState?.draw) currentState.draw();

    requestAnimationFrame(loop);
}

// ===== INPUT =====
function updateInput() {
    if (playerIndex === null) return;

    if (playerIndex === 0) {
        if (keys["w"]) sendMove(-1);
        if (keys["s"]) sendMove(1);
    }

    if (playerIndex === 1) {
        if (keys["ArrowUp"]) sendMove(-1);
        if (keys["ArrowDown"]) sendMove(1);
    }
}

// ===== DESENHO =====
function drawGame() {
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, w, h);

    ctx.fillStyle = "#fff";

    // paddles
    ctx.fillRect(p1_x, p1_y, p_w, p_h);
    ctx.fillRect(p2_x, p2_y, p_w, p_h);

    // bola
    ctx.fillRect(ball_x, ball_y, 10, 10);
}

// ===== SETUP =====
function setup() {
    resizeCanvas();

    p1_y = p2_y = (h / 2) - (p_h / 2);
    p1_points = 0;
    p2_points = 0;

    ball_x = w / 2;
    ball_y = h / 2;
}

// ===== SOCKET EVENTS =====
socket.on("connect", () => {
    console.log("Conectado ao servidor");
});

socket.on("playerIndex", (index) => {
    playerIndex = index;
});

socket.on("state", (state) => {
    ball_x = state.ball.x;
    ball_y = state.ball.y;

    p1_y = state.paddles[0];
    p2_y = state.paddles[1];
});

// ===== ENVIAR INPUT =====
function sendMove(direction) {
    socket.emit("move", {
        code: roomCode,
        direction
    });
}

// ===== EVENTS =====
document.addEventListener("keydown", (e) => {
    keys[e.key] = true;
});

document.addEventListener("keyup", (e) => {
    keys[e.key] = false;
});

window.addEventListener("resize", resizeCanvas);

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    w = canvas.width;
    h = canvas.height;

    p2_x = w - p_w - 10;
}

// ===== START =====
currentState = gameState;
currentState.onEnter();
requestAnimationFrame(loop);

</script>

</body>
</html>
