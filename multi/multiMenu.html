<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Multiplayer</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background: radial-gradient(circle, #0a0a0a, #000);
    font-family: monospace;
    color:cyan;
}

/* CONTAINER */
.multiplayer{
    background: rgba(0,0,0,0.6);
    border:2px solid cyan;
    padding:30px;
    border-radius:15px;
    text-align:center;
    box-shadow:0 0 25px cyan;
    width:90%;
    max-width:400px;
}

/* TÍTULO */
.multiplayer h2{
    margin-bottom:20px;
    text-shadow:0 0 10px cyan;
}

/* BOTÕES */
.mp-buttons{
    display:flex;
    gap:10px;
    margin-bottom:15px;
}

.mp-buttons input{
    flex:1;
    padding:10px;
    background:black;
    border:2px solid cyan;
    color:cyan;
    outline:none;
}

.mp-buttons button{
    padding:10px;
    border:2px solid cyan;
    background:transparent;
    color:cyan;
    cursor:pointer;
    transition:0.3s;
}

.mp-buttons button:hover{
    background:cyan;
    color:black;
    box-shadow:0 0 10px cyan;
}

/* INFO SALA */
.room-info{
    margin-top:10px;
}

.hidden{
    display:none;
}

.room-info span{
    color:#00ff88;
    text-shadow:0 0 8px #00ff88;
}

/* STATUS */
#status{
    margin-top:15px;
    font-weight:bold;
}

#status.offline{ color: gray; }
#status.success{ color: #00ff88; text-shadow:0 0 8px #00ff88;}
#status.error{ color: red; }

/* BOTÃO SAIR */
#leaveRoom{
    margin-top:10px;
    border:2px solid red;
    color:red;
}

#leaveRoom:hover{
    background:red;
    color:black;
    box-shadow:0 0 10px red;
}

#playersList{
    margin-top:10px;
    text-align:left;
    font-size:14px;
}

.player{
    padding:5px;
    border-bottom:1px solid rgba(0,255,255,0.2);
}

#nickname{
    width:100%;
    padding:10px;
    margin-bottom:10px;
    background:black;
    border:2px solid cyan;
    color:cyan;
    outline:none;
}

#onlineBtn{
    width:100%;
    padding:10px;
    margin-bottom:10px;
    border:2px solid gray;
    background:transparent;
    color:gray;
    cursor:pointer;
    transition:0.3s;
}

/* HOVER */
#onlineBtn:hover{
    border-color:cyan;
    color:cyan;
    box-shadow:0 0 10px cyan;
}

/* QUANDO ONLINE */
#onlineBtn.online{
    border-color:#00ff88;
    color:#00ff88;
    box-shadow:0 0 12px #00ff88;
}

/* CLIQUE */
#onlineBtn:active{
    transform:scale(0.95);
}


</style>

</head>

<body>

<div class="multiplayer">
    <h2>👥 MULTIPLAYER</h2>

    <input id="nickname" placeholder="Seu nickname">

    <button id="onlineBtn">🔌 Ficar Online</button>

    <div class="mp-buttons">
        <button id="createRoom">Criar</button>
        <input id="roomCode" placeholder="Código">
        <button id="joinRoom">Entrar</button>
    </div>

    <div class="room-info hidden" id="roomInfo">
        <p>Sala: <span id="currentRoom"></span></p>

        <div id="playersList"></div>

        <button id="copyRoom">📋 Copiar</button>
        <button id="leaveRoom">❌ Sair</button>
    </div>

    <p id="status" class="offline">Offline</p>
</div>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {

    const socket = io("https://node-project-server-s945.onrender.com", {
        autoConnect: false,
        transports: ["websocket"] 
    });

    const statusEl = document.getElementById("status");
    const roomInfo = document.getElementById("roomInfo");
    const currentRoomEl = document.getElementById("currentRoom");
    const playersList = document.getElementById("playersList");

    const createBtn = document.getElementById("createRoom");
    const joinBtn = document.getElementById("joinRoom");
    const input = document.getElementById("roomCode");
    const nicknameInput = document.getElementById("nickname");
    const onlineBtn = document.getElementById("onlineBtn");

    let currentRoom = null;
    let isOnline = false;

    function setStatus(msg, type="offline"){
        statusEl.textContent = msg;
        statusEl.className = type;
    }

    function validateNick(){
        const nick = nicknameInput.value.trim();

        if(!nick){
            setStatus("❌ Digite um nickname", "error");
            return null;
        }

        return nick;
    }

    function enterRoomUI(code){
        currentRoom = code;

        currentRoomEl.textContent = code;
        roomInfo.classList.remove("hidden");

        createBtn.disabled = true;
        joinBtn.disabled = true;
        input.disabled = true;
        nicknameInput.disabled = true;

        setStatus("🟢 Dentro da sala", "success");
    }

    function leaveRoom(){
        if(currentRoom){
            socket.emit("leaveRoom", currentRoom);
        }

        roomInfo.classList.add("hidden");

        createBtn.disabled = false;
        joinBtn.disabled = false;
        input.disabled = false;
        nicknameInput.disabled = false;

        playersList.innerHTML = "";
        currentRoom = null;

        setStatus("🟡 Online (fora da sala)", "offline");
    }

    // =====================
    // BOTÃO ONLINE
    // =====================

   onlineBtn.onclick = () => {

    if(!isOnline){

        const nick = validateNick();
        if(!nick) return;

        setStatus("🔄 Conectando...", "offline");
        onlineBtn.textContent = "⏳ Conectando...";

        socket.connect();

    } else {

        socket.disconnect();
        }
    };

    // =====================
    // SOCKET EVENTS
    // =====================

    socket.on("connect", () => {
        isOnline = true;

        onlineBtn.textContent = "🟢 Online";
        onlineBtn.classList.add("online");

        setStatus("🟢 Conectado ao servidor", "success");
    });

    socket.on("disconnect", () => {
        isOnline = false;

        onlineBtn.textContent = "🔌 Ficar Online";
        onlineBtn.classList.remove("online");

        leaveRoom();

        setStatus("🔴 Desconectado", "error");
    });

    socket.on("roomCreated", (code) => {
        enterRoomUI(code);
        input.value = code;
    });

    socket.on("playersUpdate", (players) => {

        playersList.innerHTML = "";

        players.forEach(p => {
            const div = document.createElement("div");
            div.className = "player";
            div.textContent = "👤 " + p;
            playersList.appendChild(div);
        });

        setStatus(`👥 ${players.length} jogadores`, "success");
    });

    socket.on("errorMsg", (msg) => {
        setStatus("❌ " + msg, "error");
    });

        io.on("connection", (socket) => {
    console.log("Novo usuário conectado:", socket.id);

    socket.on("disconnect", () => {
        console.log("Usuário desconectado:", socket.id);
    });
    });

    const io = new Server(server, {
    cors: {
        origin: "*",
        methods: ["GET", "POST"]
    }
    });
    // =====================
    // BOTÕES DE SALA
    // =====================

    createBtn.onclick = () => {

        if(!isOnline){
            setStatus("❌ Fique online primeiro", "error");
            return;
        }

        const nick = validateNick();
        if(!nick) return;

        socket.emit("createRoom", nick);
    };

    joinBtn.onclick = () => {

        if(!isOnline){
            setStatus("❌ Fique online primeiro", "error");
            return;
        }

        const code = input.value.trim().toUpperCase();
        const nick = validateNick();

        if(!nick) return;

        if(!code){
            setStatus("❌ Digite um código", "error");
            return;
        }

        socket.emit("joinRoom", { code, nick });
    };

    
    document.getElementById("leaveRoom").onclick = leaveRoom;

    document.getElementById("copyRoom").onclick = () => {
        navigator.clipboard.writeText(currentRoomEl.textContent);
        setStatus("📋 Copiado!", "success");
    };

    setStatus("Offline", "offline");
});

setInterval(() => {
    console.log("Ping servidor ativo");
}, 10000);
</script>
</body>
</html>
