<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Arcade - Jogos</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    background: radial-gradient(circle, #0a0a0a, #000);
    font-family: monospace;
    color:cyan;
}

/* overlay */
#fadeOverlay{
    position:fixed;
    width:100%;
    height:100%;
    background:black;
    opacity:0;
    pointer-events:none;
    transition:0.5s;
}

/* título */
h1{
    font-size:60px;
    margin-bottom:40px;
    text-shadow:0 0 20px cyan;
}

/* ===== CARROSSEL ===== */
.carousel-wrapper{
    position:relative;
    width:80%;
    overflow:hidden;
}

.library{
    display:flex;
    gap:30px;
    overflow-x:auto;
    scroll-behavior:smooth;
    padding:40px;
    scroll-snap-type: x mandatory;
}

/* esconder scroll */
.library::-webkit-scrollbar{
    display:none;
}

/* fitas */
.tape{
    min-width:180px;
    height:240px;
    border:2px solid cyan;
    background:#111;
    cursor:pointer;
    display:flex;
    align-items:flex-end;

    transition: all 0.3s ease;
    opacity:0.5;
    transform: scale(0.9);
}

/* fita em foco */
.tape:hover:not(.focus){
    transform:translateY(-10px) scale(1.05);
    box-shadow:0 0 30px cyan;
}

/* leve blur opcional nas outras */
.tape.dim{
    opacity:0.3;
}

.tape:hover{
    transform:translateY(-10px) scale(1.05);
    box-shadow:0 0 30px cyan;
}

.label{
    width:100%;
    height:60px;
    background:cyan;
    color:black;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* animação */
.tape.inserting{
    animation: insert 0.8s forwards;
}

@keyframes insert{
    100%{
        transform:scale(0.2) translateY(600px);
        opacity:0;
    }
}

/* botões */
.nav-left, .nav-right{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    font-size:40px;
    cursor:pointer;
    padding:0px;
    background:rgba(0,0,0,0.4);
}

.nav-left{ left:0; }
.nav-right{ right:0; }

.nav-left:hover, .nav-right:hover{
    background:cyan;
    color:black;
}

/* voltar */
.back{
    margin-top:40px;
    padding:10px 20px;
    border:2px solid cyan;
    cursor:pointer;
}

.back:hover{
    background:cyan;
    color:black;
}
</style>
</head>

<body>

<div id="fadeOverlay"></div>

<audio id="insertSound" src="sounds/clack.mp3"></audio>
<audio id="errorSound" src="sounds/error_menu.mp3"></audio>

<h1>ARCADE</h1>

<!-- CARROSSEL -->
<div class="carousel-wrapper">

    <div class="nav-left" onclick="scrollLeft()">❮</div>

    <div class="library" id="carousel">

        <div class="tape" onclick="errorMenu()">
            <div class="label">???</div>
        </div>

        <div class="tape" onclick="errorMenu()">
            <div class="label">???</div>
        </div>

        <div class="tape" onclick="errorMenu()">
            <div class="label">???</div>
        </div>

        <div class="tape" onclick="startGame('pong.html', this)">
            <div class="label">PONG</div>
        </div>

        <div class="tape" onclick="errorMenu()">
            <div class="label">???</div>
        </div>

        <div class="tape" onclick="errorMenu()">
            <div class="label">???</div>
        </div>

        <!-- DUPLICA PRA TESTAR -->
        <div class="tape" onclick="errorMenu()">
            <div class="label">???</div>
        </div>

        <div class="tape" onclick="errorMenu()">
            <div class="label">???</div>
        </div>

    </div>

    <div class="nav-right" onclick="scrollRight()">❯</div>

</div>

<div class="back" onclick="goBack()">⬅ Voltar</div>

<script>
let transitioning = false

const carousel = document.getElementById("carousel")

let snapTimeout

carousel.addEventListener("scroll", () => {

    requestAnimationFrame(updateFocus)

    clearTimeout(snapTimeout)

    snapTimeout = setTimeout(() => {
        snapToCenter()
    }, 120)
})

// inicializa ao carregar
window.addEventListener("load", updateFocus)

// ===== SCROLL BOTÕES =====
function scrollLeft(){
    carousel.scrollBy({ left: -300, behavior: "smooth" })
    setTimeout(updateFocus, 400)
}

function scrollRight(){
    carousel.scrollBy({ left: 300, behavior: "smooth" })
    setTimeout(updateFocus, 400)
}

// ===== DRAG COM MOUSE =====
let isDown = false
let startX
let scrollLeftPos

carousel.addEventListener("mousedown", (e)=>{
    isDown = true
    startX = e.pageX - carousel.offsetLeft
    scrollLeftPos = carousel.scrollLeft
})

carousel.addEventListener("mouseleave", ()=> isDown = false)
carousel.addEventListener("mouseup", ()=> isDown = false)

carousel.addEventListener("mousemove", (e)=>{
    if(!isDown) return
    e.preventDefault()

    const x = e.pageX - carousel.offsetLeft
    const walk = (x - startX) * 2
    carousel.scrollLeft = scrollLeftPos - walk
})

// ===== SCROLL RODA =====
carousel.addEventListener("wheel", (e)=>{
    e.preventDefault()
    carousel.scrollLeft += e.deltaY
})

document.addEventListener("keydown", (e)=>{

    if(e.key === "ArrowRight"){
        scrollRight()
    }

    if(e.key === "ArrowLeft"){
        scrollLeft()
    }
})

// ===== ERRO =====
function errorMenu(){
    const sound = document.getElementById("errorSound")
    sound.currentTime = 0.4
    sound.play().catch(()=>{})
}

// ===== START GAME =====
function startGame(url, el){

    if(transitioning) return
    transitioning = true

    const sound = document.getElementById("insertSound")

    setTimeout(()=>{
        sound.currentTime = 1.2
        sound.play().catch(()=>{})
    },100)

    el.classList.add("inserting")

    const overlay = document.getElementById("fadeOverlay")

    setTimeout(()=> overlay.style.opacity = 1, 300)

    setTimeout(()=>{
        window.location.href = url
    },900)
}

// ===== VOLTAR =====
function goBack(){
    const overlay = document.getElementById("fadeOverlay")

    overlay.style.opacity = 1

    setTimeout(()=>{
        window.location.href = "index.html"
    },500)
}

function updateFocus(){

    const tapes = document.querySelectorAll(".tape")
    const carouselRect = carousel.getBoundingClientRect()
    const center = carouselRect.left + carouselRect.width / 2

    let closest = null
    let closestDistance = Infinity

    tapes.forEach(tape => {

        const rect = tape.getBoundingClientRect()
        const tapeCenter = rect.left + rect.width / 2

        const distance = Math.abs(center - tapeCenter)

        // 🔥 escala dinâmica estilo Netflix
        const maxDistance = 400
        const scale = Math.max(0.8, 1.3 - (distance / maxDistance))
        const opacity = Math.max(0.3, 1.2 - (distance / maxDistance))

        tape.style.transform = `scale(${scale})`
        tape.style.opacity = opacity

        if(distance < closestDistance){
            closestDistance = distance
            closest = tape
        }
    })

    tapes.forEach(t => t.classList.remove("focus"))

    if(closest){
        closest.classList.add("focus")
    }
}

function snapToCenter(){

    const tapes = document.querySelectorAll(".tape")
    const carouselRect = carousel.getBoundingClientRect()
    const center = carouselRect.left + carouselRect.width / 2

    let closest = null
    let closestDistance = Infinity

    tapes.forEach(tape => {

        const rect = tape.getBoundingClientRect()
        const tapeCenter = rect.left + rect.width / 2

        const distance = Math.abs(center - tapeCenter)

        if(distance < closestDistance){
            closestDistance = distance
            closest = tape
        }
    })

    if(closest){

        const offset =
            closest.offsetLeft -
            (carousel.clientWidth / 2) +
            (closest.clientWidth / 2)

        carousel.scrollTo({
            left: offset,
            behavior: "smooth"
        })
    }
}
</script>

</body>
</html>
