<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Arcadêmico</title>

<style>
html, body{
    margin:0;
    height:100%;
    background:#000;
    font-family: monospace;
    color:cyan;
    display:flex;
    flex-direction:column;
    align-items:center;
}

/* OVERLAY */
#fadeOverlay{
    pointer-events: none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:black;
    opacity:1;
    transition: opacity 0.5s ease;
    z-index:999;
}

/* TERMINAL */
#terminalModal{
    position:fixed;
    top:0;
    left:0;
    width:95%;
    height:100%;
    background: rgba(0,0,0,0.95);
    color:lime;
    padding:40px;
    display:none;
    z-index:1000;
}

#terminalContent{
    max-width:800px;
    white-space:pre-wrap;
    line-height:1.6;
}

#closeTerminal{
    position:absolute;
    top:20px;
    right:20px;
    padding:10px 20px;
    border:2px solid lime;
    background:transparent;
    color:lime;
    cursor:pointer;
}

/* TÍTULO */
h1{
    margin-top:40px;
    font-size:60px;
    text-shadow:0 0 20px cyan;
}

/* CARDS */
.cards{
    display:flex;
    gap:30px;
    margin-top:40px;
}

.card{
    width:220px;
    padding:20px;
    border:2px solid cyan;
    background:#111;
    cursor:pointer;
    transition:0.3s;
}

.card:hover{
    transform:translateY(-10px);
    box-shadow:0 0 20px cyan;
}

/* BOTÃO VOLTAR */
.back{
    margin-top:30px;
    padding:10px 20px;
    border:2px solid cyan;
    cursor:pointer;
}

.back:hover{
    background:cyan;
    color:black;
}
</style>
</head>

<body>

<div id="fadeOverlay"></div>

<div id="terminalModal">
    <button id="closeTerminal">X</button>
    <div id="terminalContent"></div>
</div>

<h1>ARCADÊMICO</h1>

<div class="cards">

    <div class="card" onclick="openArticle('pong.txt')">
        <h3>📄 Pong & Física</h3>
        <p>Colisões e vetores.</p>
    </div>

    <div class="card" onclick="openArticle('gameloop.txt')">
        <h3>📄 Game Loop</h3>
        <p>Loop do jogo.</p>
    </div>

    <div class="card" onclick="openArticle('crt.txt')">
        <h3>📄 Efeito CRT</h3>
        <p>Visual retrô.</p>
    </div>

</div>

<div class="back" onclick="goBack()">⬅ Voltar</div>

<script>
// FADE IN
window.onload = () => {
    requestAnimationFrame(()=>{
        document.getElementById("fadeOverlay").style.opacity = 0
    })
}

// VOLTAR
function goBack(){
    const overlay = document.getElementById("fadeOverlay")

    overlay.style.opacity = 1

    setTimeout(()=>{
        window.location.href = "index.html"
    }, 500)
}

// TERMINAL EFFECT
async function openArticle(file){

    const modal = document.getElementById("terminalModal")
    const content = document.getElementById("terminalContent")

    modal.style.display = "block"
    content.innerHTML = ""

    try {
        const response = await fetch(`articles/${file}`)
        const text = await response.text()

        let i = 0

        const typingSound = new Audio("sounds/type.mp3")
        typingSound.volume = 0.1

        const interval = setInterval(()=>{

            content.innerHTML += text[i]

            if(i % 4 === 0){
                typingSound.currentTime = 10
                typingSound.play().catch(()=>{})
            }

            i++

           if(i >= text.length){
                clearInterval(interval)

                // fade out do som
                let fade = setInterval(()=>{
                    typingSound.volume -= 0.05

                    if(typingSound.volume <= 0){
                        typingSound.pause()
                        typingSound.currentTime = 0
                        typingSound.volume = 0.2
                        clearInterval(fade)
                    }
                }, 30)
            }

        }, 20)

    } catch (err){
        content.innerHTML = "> ERRO AO CARREGAR ARQUIVO"
        console.error(err)
    }
}


// FECHAR TERMINAL
document.getElementById("closeTerminal").addEventListener("click", () => {
    document.getElementById("terminalModal").style.display = "none"
})


</script>

</body>
</html>
