<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Pong</title>

<style>
#MultiMenu{
    position: fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background: rgba(3, 0, 7, 0.95);
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    z-index:9999;
    color:white;
    font-family: monospace;
}

#MultiMenu h1{
    font-size:60px;
    margin-bottom:30px;
    text-shadow:0 0 20px cyan;
}

#MultiMenu button{
    padding:15px 40px;
    margin:10px;
    font-size:20px;
    background:transparent;
    border:2px solid cyan;
    color:cyan;
    cursor:pointer;
    transition:0.3s;
}

#MuitMenu button:hover{
    background:cyan;
    color:black;
    box-shadow:0 0 20px cyan;
}

#exitMenu{
    position: fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background: rgba(3, 0, 7, 0.95);
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    z-index:9999;
    color:white;
    font-family: monospace;
}

#exitMenu h1{
    font-size:60px;
    margin-bottom:30px;
    text-shadow:0 0 20px cyan;
}

#exitMenu button{
    padding:15px 40px;
    margin:10px;
    font-size:20px;
    background:transparent;
    border:2px solid cyan;
    color:cyan;
    cursor:pointer;
    transition:0.3s;
}

#exitMenu button:hover{
    background:cyan;
    color:black;
    box-shadow:0 0 20px cyan;
}
</style>
</head>

<body style="margin:0; overflow:hidden;">
    
<canvas id="canvas"></canvas>

<script src="core/debug.js"></script>
<script src="states/menu.js"></script>
<script src="states/game.js"></script>

<script>
// ===== BLOQUEAR RELOAD =====
document.addEventListener("keydown", function(e){

    // ESC abre/fecha menu
    if(e.key === "Escape"){

        const menu = document.getElementById("exitMenu")

        if(menu){
            // já aberto → fechar
            menu.remove()
            window.timeScale = 1
        } else {
            // abrir menu
            showExitMenu()
        }
    }

    // bloquear reload
    if(e.key === "F5" || (e.ctrlKey && e.key === "r")){
        e.preventDefault()
        showExitMenu()
    }

})

// ===== MENU DE SAÍDA =====
function showExitMenu(){

    // evita duplicar
    if(document.getElementById("exitMenu")) return

    // pausa jogo (se quiser)
    window.timeScale = 0

    const div = document.createElement("div")
    div.id = "exitMenu"

    div.innerHTML = `
        <h1>SAIR DO JOGO?</h1>
        <button id="continueBtn">Continuar</button>
        <button id="exitBtn">Voltar ao menu</button>
    `

    document.body.appendChild(div)

    // CONTINUAR
    document.getElementById("continueBtn").onclick = () => {
        div.remove()
        window.timeScale = 1
    }

    // SAIR
    document.getElementById("exitBtn").onclick = () => {

        shutdownActive = true
        shutdownProgress = 0

        setTimeout(()=>{
            window.location.href = "index.html"
        }, 500)
    }

}
</script>

</body>
</html>
