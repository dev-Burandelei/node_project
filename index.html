<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Arcade Hub</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background: radial-gradient(circle, #0a0a0a, #000);
    font-family: monospace;
    color:cyan;
}

/* título */
h1{
    font-size:70px;
    text-shadow:0 0 20px cyan;
    margin-bottom:50px;
}

/* menu */
.menu{
    display:flex;
    gap:30px;
}

.btn{
    padding:15px 40px;
    border:2px solid cyan;
    cursor:pointer;
    transition:0.3s;
}

.btn:hover{
    background:cyan;
    color:black;
    box-shadow:0 0 20px cyan;
}
</style>
</head>

<body>

<h1>ARCADE HUB</h1>

<div class="menu">
    <div class="btn" onclick="go('games.html')">🎮 JOGOS</div>
    <div class="btn" onclick="go('articles.html')">📚 ARCADÊMICO</div>
</div>

<script>
function go(page){
    document.body.style.opacity = 0

    setTimeout(()=>{
        window.location.href = page
    },300)
}

// fade in
document.body.style.opacity = 0
window.onload = () => {
    requestAnimationFrame(()=>{
        document.body.style.opacity = 1
    })
}
</script>

</body>
</html>
