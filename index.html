<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Arcade Retrô</title>

<style>
html, body{
    margin:0;
    height:100%;
    background:#000;
    font-family: monospace;
    overflow:hidden;
}

/* ===== OVERLAY ===== */
#fadeOverlay{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:black;
    opacity:0;
    pointer-events:none;
    transition: opacity 0.5s ease;
    z-index:999;
}

/* ===== TERMINAL MODAL ===== */
#terminalModal{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background: rgba(0,0,0,0.95);
    color:lime;
    font-family: monospace;
    padding:40px;
    display:none;
    z-index:1000;
}

#terminalContent{
    max-width:800px;
    white-space:pre-wrap;
    line-height:1.5;
}

#closeTerminal{
    position:absolute;
    top:20px;
    right:20px;
    padding:10px 20px;
    border:2px solid lime;
    background:transparent;
    color:lime;
    cursor:pointer;
}

/* ===== LAYOUT ===== */
body{
    display:flex;
    flex-direction:column;
    align-items:center;
    background: radial-gradient(circle, #0a0a0a, #000);
    color:cyan;
}

/* NAV */
.nav{
    margin-top:20px;
}

.nav button{
    margin:0 10px;
    padding:10px 20px;
    background:transparent;
    border:2px solid cyan;
    color:cyan;
    cursor:pointer;
}

.nav button:hover{
    background:cyan;
    color:black;
}

/* SECTIONS */
.section{
    display:none;
    flex-direction:column;
    align-items:center;
    margin-top:40px;
}

.section.active{
    display:flex;
}

/* TÍTULO */
h1{
    font-size:60px;
    margin-bottom:30px;
    text-shadow: 0 0 20px cyan;
}

/* ===== FITAS ===== */
.library{
    display:flex;
    gap:40px;
}

.tape{
    width:180px;
    height:240px;
    background:#111;
    border:2px solid cyan;
    cursor:pointer;
    display:flex;
    justify-content:flex-end;
    align-items:center;
}

.tape:hover{
    transform: translateY(-10px) scale(1.05);
    box-shadow:0 0 30px cyan;
}

.tape.inserting{
    animation: insertTape 0.8s forwards;
}

@keyframes insertTape{
    100%{
        transform: scale(0.2) translateY(600px);
        opacity:0;
    }
}

.label{
    width:100%;
    height:60px;
    background:cyan;
    color:black;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* ===== CARDS ===== */
.cards{
    display:flex;
    gap:30px;
}

.card{
    width:220px;
    padding:20px;
    border:2px solid cyan;
    background:#111;
    cursor:pointer;
    transition:0.3s;
}

.card:hover{
    transform:translateY(-10px);
    box-shadow:0 0 20px cyan;
}
</style>
</head>

<body>

<div id="fadeOverlay"></div>

<div id="terminalModal">
    <button id="closeTerminal">FECHAR</button>
    <div id="terminalContent"></div>
</div>

<audio id="insertSound" src="sounds/clack.mp3"></audio>
<audio id="errorSound" src="sounds/error_menu.mp3"></audio>

<!-- NAV -->
<div class="nav">
    <button onclick="showSection('games')">🎮 Jogos</button>
    <button onclick="showSection('articles')">📚 Arcadêmico</button>
</div>

<!-- JOGOS -->
<div id="games" class="section active">
    <h1>ARCADE</h1>

    <div class="library">
        <div class="tape" onclick="startGame('pong.html', this)">
            <div class="label">PONG</div>
        </div>

        <div class="tape" onclick="errorMenu('Em breve')">
            <div class="label">???</div>
        </div>
    </div>
</div>

<!-- ARTIGOS -->
<div id="articles" class="section">
    <h1>ARCADÊMICO</h1>

    <div class="cards">

        <div class="card" onclick="openArticle('Pong & Física', 'Colisões, vetores e reflexão são essenciais para o movimento da bola.')">
            <h3>📄 Pong & Física</h3>
            <p>Como colisões funcionam.</p>
        </div>

        <div class="card" onclick="openArticle('Game Loop', 'requestAnimationFrame mantém o jogo rodando em sincronia com o navegador.')">
            <h3>📄 Game Loop</h3>
            <p>Loop do jogo.</p>
        </div>

    </div>
</div>

<script>
function showSection(id){
    document.querySelectorAll(".section").forEach(sec=>{
        sec.classList.remove("active")
    })
    document.getElementById(id).classList.add("active")
}

// ===== ERRO =====
function errorMenu(msg){
    const sound = document.getElementById("errorSound")
    sound.currentTime = 0.4
    sound.play().catch(()=>{})
}

// ===== START GAME =====
function startGame(url, el){

    if(el.classList.contains("inserting")) return

    const sound = document.getElementById("insertSound")

    // som sincronizado
    setTimeout(()=>{
        sound.currentTime = 1.2
        sound.play().catch(()=>{})
    },0)

    el.classList.add("inserting")

    const overlay = document.getElementById("fadeOverlay")

    setTimeout(()=>{
        overlay.style.opacity = 1
    },300)

    setTimeout(()=>{
        window.location.href = url
    },900)
}

// ===== TERMINAL =====
function openArticle(title, text){

    const modal = document.getElementById("terminalModal")
    const content = document.getElementById("terminalContent")

    modal.style.display = "block"
    content.innerHTML = ""

    let fullText = `> ${title}\n\n${text}\n\n> _`

    let i = 0

    let interval = setInterval(()=>{
        content.innerHTML += fullText[i]
        i++

        if(i >= fullText.length){
            clearInterval(interval)
        }
    },20)
}

document.getElementById("closeTerminal").onclick = () => {
    document.getElementById("terminalModal").style.display = "none"
}
</script>

</body>
</html>
